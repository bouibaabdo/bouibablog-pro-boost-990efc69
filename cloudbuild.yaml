# تكوين Google Cloud Build لأتمتة البناء والنشر (CI/CD)
#
# هذا الملف يتيح لك خيارين للنشر التلقائي عند كل عملية دفع (Push) إلى مستودع GitHub:
# 1. النشر على Google Cloud Run كحاوية Docker مستقلة وسريعة التوسع.
# 2. النشر على Cloudflare Pages باستخدام Wrangler CLI.

steps:
  # =========================================================================
  # الخطوة 1: تثبيت الاعتمادات وبناء التطبيق محلياً للتأكد من خلوه من الأخطاء
  # =========================================================================
  - name: "node:20-slim"
    entrypoint: "npm"
    args: ["ci"]
    id: "Install Dependencies"

  - name: "node:20-slim"
    entrypoint: "npm"
    args: ["run", "build"]
    id: "Verify Build"

  # =========================================================================
  # الخيار الأول: البناء والنشر على Google Cloud Run (مفعّل تلقائياً أدناه)
  # =========================================================================
  # أ. بناء صورة Docker الخاصة بالتطبيق
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA",
        ".",
      ]
    id: "Build Docker Image"

  # ب. رفع الصورة إلى مستودع حزم جوجل (Artifact Registry)
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"]
    id: "Push to Artifact Registry"

  # ج. نشر الصورة على Google Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      [
        "run",
        "deploy",
        "$_SERVICE_NAME",
        "--image",
        "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA",
        "--region",
        "$_REGION",
        "--platform",
        "managed",
        "--allow-unauthenticated",
      ]
    id: "Deploy to Cloud Run"

  # =========================================================================
  # الخيار الثاني: النشر على Cloudflare Pages (اختياري - قم بإلغاء التعليق لتفعيله)
  # =========================================================================
  # - name: 'node:20-slim'
  #   entrypoint: 'npx'
  #   args: ['wrangler', 'pages', 'deploy', 'dist', '--project-name=bouibacademy-pro']
  #   env:
  #     - 'CLOUDFLARE_API_TOKEN=$_CLOUDFLARE_API_TOKEN'
  #     - 'CLOUDFLARE_ACCOUNT_ID=$_CLOUDFLARE_ACCOUNT_ID'
  #   id: 'Deploy to Cloudflare Pages'

# الصور التي سيتم توليدها والاحتفاظ بها
images:
  - "$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO_NAME/$_SERVICE_NAME:$COMMIT_SHA"

# قيم افتراضية للمتغيرات (يمكنك تعديلها في واجهة Cloud Build)
substitutions:
  _REGION: "us-central1"
  _REPO_NAME: "bouibacademy-repo"
  _SERVICE_NAME: "bouiba-blog-pro"
  # _CLOUDFLARE_API_TOKEN: 'your-cloudflare-token'
  # _CLOUDFLARE_ACCOUNT_ID: 'your-cloudflare-account-id'

options:
  logging: CLOUD_LOGGING_ONLY
