name: Automated Daily Article Generator

on:
  schedule:
    # Run every day at 08:00 AM UTC
    - cron: "0 8 * * *"
  workflow_dispatch:
    # Allow manual triggering from GitHub Actions tab

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Daily Article
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate:daily-article

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/ content/omni-social-posts/ content/facebook-posts/
          if git diff --staged --quiet; then
            echo "No new article generated."
          else
            git commit -m "feat(content): 🤖 automated daily article and social posts package"
            git push origin main
          fi
